name: EPS Live Viewer multi-platform release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing or new release tag
        required: true
        default: eps-live-viewer-v2.2.1
      target:
        description: Build all platforms or replace only the Apple Silicon DMG
        type: choice
        options: [all, macos-arm64]
        default: all
  push:
    tags:
      - "eps-live-viewer-v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event.inputs.target == 'macos-arm64' && '[{"runner":"macos-latest","target":"macOS Apple Silicon","artifact":"EPSLiveViewer-macOS-arm64.dmg"}]' || '[{"runner":"windows-latest","target":"Windows x64","artifact":"EPSLiveViewer-Windows-x64.zip"},{"runner":"ubuntu-latest","target":"Linux x64","artifact":"EPSLiveViewer-Linux-x64.tar.gz"},{"runner":"macos-latest","target":"macOS Apple Silicon","artifact":"EPSLiveViewer-macOS-arm64.dmg"},{"runner":"macos-15-intel","target":"macOS Intel","artifact":"EPSLiveViewer-macOS-x64.dmg"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install build dependencies
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Install Linux Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libxcb-cursor0 libxkbcommon-x11-0

      - name: Check image workflows and MP4 decoding
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Check native macOS mouse interaction
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: cocoa
          EPS_REQUIRE_COCOA: "1"
          EPS_CONTROL_SCREENSHOTS: control-screenshots
          PYTHONPATH: .
        run: python tests/test_desktop_controls.py -v

      - name: Check packaged macOS controls
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: cocoa
          EPS_REQUIRE_COCOA: "1"
          EPS_CONTROL_SCREENSHOTS: packaged-control-screenshots
        run: |
          python -m PyInstaller --noconfirm --onedir --console \
            --name ControlsSmoke --paths . --additional-hooks-dir hooks \
            --distpath control-dist --workpath control-build tests/test_desktop_controls.py
          control-dist/ControlsSmoke/ControlsSmoke -v

      - name: Preserve interaction screenshots
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: controls-${{ matrix.runner }}
          path: |
            control-screenshots/
            packaged-control-screenshots/
          if-no-files-found: ignore

      - name: Build Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name EPSLiveViewer `
            --icon "resources\icon.ico" `
            --add-data "resources;resources" `
            --additional-hooks-dir hooks `
            main.py
          New-Item -ItemType Directory -Force package, packages | Out-Null
          Copy-Item dist\EPSLiveViewer.exe package\
          Copy-Item -Path config.json, README.md, README_EN.md -Destination package\
          Compress-Archive -Path package\* -DestinationPath "packages\${{ matrix.artifact }}"

      - name: Build Linux executable
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed \
            --name EPSLiveViewer \
            --add-data "resources:resources" \
            --collect-all imageio_ffmpeg \
            main.py
          mkdir -p package packages
          chmod +x dist/EPSLiveViewer
          cp dist/EPSLiveViewer README.md README_EN.md package/
          tar -C package -czf "packages/${{ matrix.artifact }}" .

      - name: Build macOS application
        if: runner.os == 'macOS'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed \
            --name EPSLiveViewer \
            --osx-bundle-identifier com.zhentongli.epsliveviewer \
            --add-data "resources:resources" \
            --collect-all imageio_ffmpeg \
            main.py
          APP_VERSION="${RELEASE_TAG#eps-live-viewer-v}"
          python scripts/configure_macos_bundle.py \
            dist/EPSLiveViewer.app/Contents/Info.plist "$APP_VERSION"

          FORMALLY_SIGNED=false
          if [[ -n "$MACOS_CERTIFICATE" && -n "$MACOS_CERTIFICATE_PASSWORD" ]]; then
            KEYCHAIN_PATH="$RUNNER_TEMP/eps-live-viewer.keychain-db"
            KEYCHAIN_PASSWORD="eps-live-viewer-build"
            CERTIFICATE_PATH="$RUNNER_TEMP/eps-live-viewer.p12"
            printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security import "$CERTIFICATE_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" \
              -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security set-key-partition-list -S apple-tool:,apple: -s \
              -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            if [[ -z "$MACOS_SIGNING_IDENTITY" ]]; then
              MACOS_SIGNING_IDENTITY="$(security find-identity -v -p codesigning \
                "$KEYCHAIN_PATH" | awk -F\" 'NR == 1 {print $2}')"
            fi
            codesign --force --deep --options runtime --timestamp \
              --sign "$MACOS_SIGNING_IDENTITY" dist/EPSLiveViewer.app
            codesign --verify --deep --strict --verbose=2 dist/EPSLiveViewer.app
            FORMALLY_SIGNED=true
          else
            codesign --force --deep --sign - dist/EPSLiveViewer.app
          fi
          mkdir -p dmg-root packages
          cp -R dist/EPSLiveViewer.app dmg-root/
          ln -s /Applications dmg-root/Applications
          cp README.md README_EN.md dmg-root/
          hdiutil create \
            -volname "EPS Live Viewer ${APP_VERSION}" \
            -srcfolder dmg-root \
            -format UDZO \
            -ov "packages/${{ matrix.artifact }}"

          if [[ "$FORMALLY_SIGNED" == true \
             && -n "$MACOS_NOTARY_APPLE_ID" \
             && -n "$MACOS_NOTARY_TEAM_ID" \
             && -n "$MACOS_NOTARY_PASSWORD" ]]; then
            xcrun notarytool submit "packages/${{ matrix.artifact }}" \
              --apple-id "$MACOS_NOTARY_APPLE_ID" \
              --team-id "$MACOS_NOTARY_TEAM_ID" \
              --password "$MACOS_NOTARY_PASSWORD" \
              --wait
            xcrun stapler staple "packages/${{ matrix.artifact }}"
            xcrun stapler validate "packages/${{ matrix.artifact }}"
          fi

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: packages/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/eps-live-viewer-v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: EPSLiveViewer-*
          merge-multiple: true

      - name: Create checksums
        if: github.event.inputs.target != 'macos-arm64'
        run: sha256sum release-assets/* > release-assets/SHA256SUMS.txt

      - name: Preserve checksums for unchanged packages
        if: github.event.inputs.target == 'macos-arm64'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          gh release download "$RELEASE_TAG" --pattern SHA256SUMS.txt --dir release-assets
          python scripts/update_asset_checksum.py release-assets/SHA256SUMS.txt \
            release-assets/EPSLiveViewer-macOS-arm64.dmg

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
          RELEASE_TARGET: ${{ github.event.inputs.target }}
        run: |
          if [[ "$RELEASE_TARGET" == "macos-arm64" ]]; then
            gh release view "$RELEASE_TAG" >/dev/null
            gh release upload "$RELEASE_TAG" \
              release-assets/EPSLiveViewer-macOS-arm64.dmg \
              release-assets/SHA256SUMS.txt --clobber
            exit 0
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release delete-asset "$RELEASE_TAG" EPSLiveViewer-macOS-arm64.zip --yes || true
            gh release delete-asset "$RELEASE_TAG" EPSLiveViewer-macOS-x64.zip --yes || true
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" --notes-file RELEASE_NOTES.md
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --verify-tag \
              --notes-file RELEASE_NOTES.md \
              --title "EPS Live Viewer ${RELEASE_TAG#eps-live-viewer-}"
          fi
